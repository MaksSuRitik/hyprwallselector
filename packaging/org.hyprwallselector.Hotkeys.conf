<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
 <policy user="root"><allow own="org.hyprwallselector.Hotkeys"/></policy>
 <policy context="default">
  <allow send_destination="org.hyprwallselector.Hotkeys" send_interface="org.hyprwallselector.Hotkeys" send_member="Register"/>
  <allow send_destination="org.hyprwallselector.Hotkeys" send_interface="org.hyprwallselector.Hotkeys" send_member="Unregister"/>
  <allow send_destination="org.hyprwallselector.Hotkeys" send_interface="org.freedesktop.DBus.Introspectable"/>
  <allow receive_sender="org.hyprwallselector.Hotkeys"/>
 </policy>
</busconfig>
